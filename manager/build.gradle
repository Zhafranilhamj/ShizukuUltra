            signingConfig = signingConfigs.sign
            minifyEnabled = true
            shrinkResources = true
            vcsInfo.include = false
            proguardFiles = ["proguard-rules.pro"]
        }
    }
    externalNativeBuild {
        cmake {
            path = file("src/main/jni/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        // Store dex uncompressed (and page-aligned) so ART can map it straight from the APK.
        // The server runs from this APK via app_process and gets no app dexopt of its own:
        // with deflated dex it had to inflate every classes*.dex into anonymous memory on each
        // start (~1 s of class loading and tens of MB that end up in swap). Costs some APK size.
        dex {
            useLegacyPackaging = false
        }
        resources {
            excludes += ["**"]
        }
    }
    dependenciesInfo {
        includeInApk = false
    }
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
    sourceSets {
        main {
            aidl.srcDirs = ["src/main/aidl"]
        }
    }
}

spotless {
    kotlin {
        // Source dirs only: a project-wide tree also covers src/main/assets, which
        // copyCompatApkDebug writes, and Gradle fails spotless + lint in one run.
        target fileTree("src/main/java") { include "**/*.kt" },
                fileTree("src/test/java") { include "**/*.kt" },
                fileTree("src/androidTest/java") { include "**/*.kt" }
        ktlint("1.3.1")
        trimTrailingWhitespace()
        indentWithSpaces()
        endWithNewline()
    }
}


// Generated Material 3 theme resources, replacing the dev.rikka.tools.materialthemebuilder plugin.
//
// That plugin (1.5.1, last published 2024) resolves AGP's legacy BaseExtension, which AGP 9
// removed, so `id "dev.rikka.tools.materialthemebuilder"` failed configuration outright with
// "Extension of type 'BaseExtension' does not exist" - nothing in this module could be configured
// or built. Its `materialThemeBuilder { ... }` block is now scripts/dev/palette/GenerateTheme.java,
// which writes the same resources (md_theme_* colours, palette* attributes and the dynamic-colour
// values-v31 themes) from the same seed, and is run here into a generated
// res directory that is part of the main source set. It needs nothing but the JDK: the colour
// maths comes from material-color-utilities, vendored in scripts/dev/palette/mcu.
def generatedThemeResDir = layout.buildDirectory.dir("generated/themeRes")

def generateThemeRes = tasks.register("generateThemeRes", Exec) {
    description = "Generates the Material 3 theme resources (md_theme_*, palette*, dynamic + accents)."
    workingDir = rootProject.projectDir.absolutePath
    def outDir = generatedThemeResDir.get().asFile
    inputs.dir(file("${rootProject.projectDir}/scripts/dev/palette"))
    inputs.file(file("${rootProject.projectDir}/scripts/dev/gen-theme-res.sh"))
    outputs.dir(outDir)
    doFirst {
        outDir.mkdirs()
    }
    commandLine "bash", "scripts/dev/gen-theme-res.sh", outDir.absolutePath
}

// srcDir() only accepts a path here - AGP 9 rejects Provider instances in the SourceSet API with
// "You cannot add Provider instances to the Android SourceSet API" - so resolve it eagerly.
android.sourceSets.main.res.srcDir(generatedThemeResDir.get().asFile.absolutePath)
tasks.configureEach { task ->
    // Every task in this project has to see the resources generated above. Depending on the
    // generator is the cheapest correct answer: Gradle validates that no task reads another task's
    // output without a declared dependency ("Property has implicit dependency" on
    // :manager:map<Variant>SourceSetPaths was the first one), and the set of resource readers is
    // not stable across AGP versions. The generator itself does no project work, so this cannot
    // create a cycle, and javac only runs once per build.
    if (task.name != "generateThemeRes") {
        task.dependsOn(generateThemeRes)
    }
}

// Overwrite the aapt2-optimised resource archive for one release variant, collapsing resource
// names while honouring manager/aapt2-resources.cfg (see that file for the no_obfuscate list).
//
// Flavors matter here. Each flavor gets its own archive under
// intermediates/optimized_processed_res/<variant>/optimizeReleaseResources/, and AGP registers one
// optimize task per variant (optimizeShizukuplusReleaseResources, optimizeDropinReleaseResources).
// The old hook looked for the unflavored "optimizeReleaseResources", which a flavored build never
// has, so nothing was ever finalizedBy'd: the collapse step silently never ran, aapt2's
// --resources-config-path was never applied - and `-x collapseReleaseResourceNames` in CI failed
// task selection with "task not found" for a task that did exist. Now there is one collapse task
// per release variant, wired from that variant's optimize task (per variant, not shared: a single
// shared task would only run once per build and leave the second flavor uncollapsed).
// Variant callbacks have to be registered before AGP configures the project. Doing it inside
// afterEvaluate fails with "It is too late to add actions as the callbacks already executed", so
// the variant/flavor names are collected here and used by the afterEvaluate block below.
def releaseVariantNames = []
def flavorNames = []
androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.buildType == "release") {
            releaseVariantNames.add(
                variant.name.substring(0, 1).toUpperCase() + variant.name.substring(1))
        }
        if (variant.flavorName != null && !variant.flavorName.isEmpty()) {
            flavorNames.add(
                variant.flavorName.substring(0, 1).toUpperCase() + variant.flavorName.substring(1))
        }
    }
}

def registerCollapseTask = { String variantName ->
    def taskName = "collapse${variantName.capitalize()}ResourceNames"
    return tasks.register(taskName) {
        def configFile = file("aapt2-resources.cfg")
        // The archive path is resolved in doLast: AGP creates it during the build, so it cannot be
        // declared as a task input at configuration time without an implicit (and fragile) task
        // dependency on the resource optimizer.
        def variantNameForTask = variantName
        doLast {
            def aapt2 = Paths.get(project.android.sdkDirectory.path, "build-tools",
                project.android.buildToolsVersion, "aapt2")
            def root = new File(project.buildDir, "intermediates/optimized_processed_res")
            def variantDirs = root.listFiles({ File f ->
                f.isDirectory() && f.name.equalsIgnoreCase(variantNameForTask)
            } as FileFilter)
            if (variantDirs == null || variantDirs.length == 0) {
                throw new GradleException(
                    "${taskName}: no intermediates/optimized_processed_res/${variantNameForTask} " +
                    "directory - the aapt2 resource-collapse step would have been skipped.")
            }
            def execOps = services.get(ExecOperations)
            variantDirs.each { variantDir ->
                def inner = new File(variantDir, "optimizeReleaseResources")
                // Name has been stable across AGP 8/9 (resources-release-optimize.ap_); accept any
                // .ap_ there so a rename by AGP doesn't silently skip the collapse again.
                def archives = inner.listFiles({ File f ->
                    f.isFile() && f.name.endsWith(".ap_")
                } as FileFilter) ?: [] as File[]
                if (archives.isEmpty()) {
                    throw new GradleException(
                        "${taskName}: ${inner} holds no *.ap_ resource archive")
                }
                archives.each { zip ->
                    def legacy = new File("${zip}.opt")
                    if (legacy.exists()) legacy.delete()
                    logger.lifecycle("${taskName}: collapsing resource names in ${zip}")
                    execOps.exec {
                        commandLine aapt2.toFile(), "optimize", "--collapse-resource-names",
                            "--resources-config-path", configFile.absolutePath,
                            "-o", legacy, zip
                        ignoreExitValue = false
                    }
                    if (!legacy.exists()) {
                        throw new GradleException("${taskName}: aapt2 produced no output for ${zip}")
                    }
                    delete(zip)
                    if (!legacy.renameTo(zip)) {
                        throw new GradleException("${taskName}: could not replace ${zip}")
                    }
                }
            }
        }
    }
}

afterEvaluate {
    // Map each release variant to its optimize task by name: optimize<Variant>Resources.
    //
    // android.applicationVariants no longer exists in AGP 9 - reading it fails configuration with
    // "Could not get unknown property 'applicationVariants' for object of type
    // com.android.build.gradle.internal.dsl.ApplicationExtensionImpl$AgpDecorated" - so the variant
    // list comes from the Android Components API instead, which is the supported surface.
    def wiredVariants = [] as Set
    releaseVariantNames.each { capitalizedName ->
        def expected = "optimize${capitalizedName}Resources"
        def optimizeTask = tasks.findByName(expected)
        if (optimizeTask == null) {
            // Different AGP versions capitalize/abbreviate a little differently; fall back to any
            // optimize*ReleaseResources task whose name mentions this variant.
            def normalized = capitalizedName.toLowerCase()
            def match = tasks.names.find { n ->
                n.startsWith("optimize") && n.endsWith("ReleaseResources") &&
                    n.substring("optimize".length(), n.length() - "ReleaseResources".length())
                        .toLowerCase() == normalized.replace("release", "")
            }
            if (match != null) {
                optimizeTask = tasks.findByName(match)
            }
        }
        if (optimizeTask == null) {
            logger.warn("collapseReleaseResourceNames: no optimize*ReleaseResources task found for " +
                "${capitalizedName}; aapt2 resource-name collapsing will not run for it.")
            return
        }
        def collapseTask = registerCollapseTask(capitalizedName)
        optimizeTask.finalizedBy(collapseTask)
        wiredVariants.add(capitalizedName)
    }
    if (!releaseVariantNames.isEmpty() && wiredVariants.isEmpty()) {
        logger.warn("collapseReleaseResourceNames: no release variant was wired to the collapse step.")
    }

    tasks.register("copyCompatApkRelease", Copy) {
        dependsOn ":compat:assembleRelease"
        // Use fileTree so we match both compat-release.apk (signed) and compat-release-unsigned.apk.
        // The hardcoded filename was the root cause of the compat stub never being bundled on CI (#293).
        from fileTree("${project(':compat').layout.buildDirectory.get().asFile}/outputs/apk/release") {
            include "*.apk"
        }
        into "src/main/assets"
        rename { "compat.apk" }
    }

    tasks.register("copyCompatApkDebug", Copy) {
        dependsOn ":compat:assembleDebug"
        from fileTree("${project(':compat').layout.buildDirectory.get().asFile}/outputs/apk/debug") {
            include "*.apk"
        }
        into "src/main/assets"
        rename { "compat.apk" }
    }
    
    // Wire compat and shell for both the generic pre-build hooks (single-flavor builds)
    // and the flavor-specific hooks produced when product flavors are configured.
    tasks.findByName("preReleaseBuild")?.dependsOn("copyCompatApkRelease")
    tasks.findByName("preReleaseBuild")?.dependsOn(":shell:assembleRelease")

    tasks.findByName("preDebugBuild")?.dependsOn("copyCompatApkDebug")
    tasks.findByName("preDebugBuild")?.dependsOn(":shell:assembleDebug")

    flavorNames.unique().each { name ->
        tasks.findByName("pre${name}ReleaseBuild")?.dependsOn("copyCompatApkRelease")
        tasks.findByName("pre${name}ReleaseBuild")?.dependsOn(":shell:assembleRelease")
        tasks.findByName("pre${name}DebugBuild")?.dependsOn("copyCompatApkDebug")
        tasks.findByName("pre${name}DebugBuild")?.dependsOn(":shell:assembleDebug")
    }
}


