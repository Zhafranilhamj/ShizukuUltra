android {
    testOptions {
        unitTests.all { t ->
            t.useJUnitPlatform()
            // MockK needs ByteBuddy's agent. Load it up front instead of self-attaching, which
            // JDK 21 discourages and which fails outright on some JVMs (e.g. Termux on-device).
            t.doFirst {
                def bbAgent = t.classpath.find { it.name.startsWith("byte-buddy-agent") }
                if (bbAgent != null) t.jvmArgs "-javaagent:${bbAgent}"
            }
        }
        // Robolectric tests load the app's resources and manifest.
        unitTests.includeAndroidResources = true
    }
}

// refine registers its visitor with InstrumentationScope.ALL, which re-serializes every jar on
// the unit-test runtime classpath while keeping META-INF signatures, so signed jars (conscrypt,
// BouncyCastle) fail Robolectric with "SHA-256 digest error". Excluded entries are copied
// byte-identically. Unit-test variants only, so the app's own build is unchanged.
androidComponents {
    onVariants(selector().all()) { variant ->
        ["org/conscrypt/**", "org/bouncycastle/**"].each { pattern ->
            variant.unitTest?.instrumentation?.excludes?.addAll(pattern)
        }
    }
}

sentry {
    org = "af-developments"
    projectName = "shizukuplus"
    def sentryToken = System.getenv("SENTRY_AUTH_TOKEN") ?: project.findProperty("SENTRY_AUTH_TOKEN")
    authToken = sentryToken ?: ""
    
    if (sentryToken == null || sentryToken.isEmpty()) {
        uploadNativeSymbols = false
        includeNativeSources = false
        includeSourceContext = false
        autoUploadProguardMapping = provider { false }
    } else {
        uploadNativeSymbols = true
        includeNativeSources = true
        includeSourceContext = true
        autoUploadProguardMapping = provider { true }
    }
    
    // Track releases with git commit info
    ignoredBuildTypes = ["debug"]

    // Project uses Glance (compose-based widgets) but not full compose-ui.
    // Disable Sentry's compose bytecode instrumentation to avoid R8 missing-class errors.
    tracingInstrumentation {
        enabled = false
    }
}

configurations.all {
    resolutionStrategy {
        force "org.bouncycastle:bcprov-jdk18on:1.86"
        force "org.bouncycastle:bcpkix-jdk18on:1.86"
        force "com.google.guava:guava:33.4.8-android"
    }
}

