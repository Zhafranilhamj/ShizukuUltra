plugins {
    id "com.android.application"
    id "dev.rikka.tools.refine"
}

android {
    namespace = "rikka.shizuku.shell"
    defaultConfig {
        versionCode = rootProject.ext.versionCode
        versionName = rootProject.ext.versionName
    }
    buildTypes {
        debug {
            multiDexEnabled = false
        }
        release {
            minifyEnabled = true
            proguardFiles = ["proguard-rules.pro"]
        }
    }
    dependenciesInfo {
        includeInApk = false
    }
    lint {
        checkReleaseBuilds = false
    }
    buildFeatures {
        buildConfig = true
    }
}

// Keep R8's mapping file for release builds.
//
// This used to walk android.applicationVariants, which AGP 9 removed; reading it fails
// configuration with "Could not get unknown property 'applicationVariants'". The Android
// Components API gives the variants instead.
//
// The dex itself is no longer extracted here: the manager reads it out of this module's APK into a
// generated assets directory (see manager/build.gradle). Writing it into
// manager/src/main/assets used to make aapt2 fail with 'Duplicate resources' for the asset merge,
// because the file appeared in the source tree while the merger was reading it.
def exportMapping = { String buildType ->
    def mapping = layout.buildDirectory.file("outputs/mapping/${buildType}/mapping.txt").get().asFile
    if (!mapping.exists()) {
        return
    }
    def mappingDir = new File(rootDir, "out/mapping")
    mappingDir.mkdirs()
    java.nio.file.Files.copy(mapping.toPath(),
        new File(mappingDir, "cmd-v${rootProject.ext.versionName}.txt").toPath(),
        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    mapping.delete()
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def buildType = variant.buildType
        // tasks.named() would throw UnknownTaskException here - AGP creates assemble<Variant> later,
        // after the variant callbacks run - so match on the name instead.
        def assembleName = "assemble${variant.name.capitalize()}"
        tasks.matching { it.name == assembleName }.configureEach { task ->
            task.doLast { exportMapping(buildType) }
        }
    }
}

dependencies {
    implementation libs.hidden.compat
    compileOnly libs.hidden.stub
}
