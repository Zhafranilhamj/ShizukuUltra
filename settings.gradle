include ":server", ":starter", ":shell", ":manager", ":common", ":database", ":compat", ":app-process"
include ":core:ui"
project(":core:ui").projectDir = file("core/ui")

def root = "api"

def propFile = file("local.properties")
def props = new Properties()

if (propFile.canRead()) {
    props.load(new FileInputStream(propFile))

    // local.properties is written by Android Studio/AGP with only `sdk.dir`, and CI writes its own
    // copy, so `api.useLocal` is usually absent. Reading props["api.useLocal"] returns null there and
    // `.equals("true")` on null threw NPE during settings evaluation - before any project was
    // configured, with a stack trace that named neither the file nor the key. Compare against the
    // literal instead, and only switch to a local checkout when a directory is actually given.
    String useLocalApi = props.getProperty("api.useLocal")
    String localApiDir = props.getProperty("api.dir")
    if (useLocalApi != null) {
        useLocalApi = useLocalApi.trim()
    }
    if ("true".equalsIgnoreCase(useLocalApi)) {
        if (localApiDir == null || localApiDir.trim().isEmpty()) {
            throw new GradleException("local.properties sets api.useLocal=true but not api.dir; " +
                "point api.dir at a local ShizukuPlus-API checkout or remove api.useLocal.")
        }
        root = localApiDir.trim()
    }
}

// The API modules live in the api/ git submodule. Without it Gradle fails with "Configuring
// project ':rish' without an existing directory"; say what to do instead.
if (!file("$root${File.separator}api").isDirectory()) {
    throw new GradleException("The api submodule is missing. Run: git submodule update --init --recursive")
}

include ":aidl"
project(":aidl").projectDir = file("$root${File.separator}aidl")

include ":rish"
project(":rish").projectDir = file("$root${File.separator}rish")

include ":shared"
project(":shared").projectDir = file("$root${File.separator}shared")

include ":api"
project(":api").projectDir = file("$root${File.separator}api")

include ":provider"
project(":provider").projectDir = file("$root${File.separator}provider")

include ":server-shared"
project(":server-shared").projectDir = file("$root${File.separator}server-shared")
