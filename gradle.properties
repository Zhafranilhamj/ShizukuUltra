org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.configureondemand=true
android.useAndroidX=true
android.nonTransitiveRClass=false

# KSP2 is used (no ksp.useKSP2 flag below on purpose).
#
# History, because this file used to carry "ksp.useKSP2=false" and AI_DEVLOG lists it as
# unremovable: on KSP 2.2.20 + Room 2.6.1 the flag was needed, because KSP2 could not cope with
# Room 2.6.1's generated DAO code ("unexpected jvm signature V"). KSP 2.3.6 removed KSP1
# completely, so the flag now makes Gradle fail configuration outright:
#   java.lang.RuntimeException: KSP1 is no longer available. Please use KSP2 instead and do not
#   explicitly set ksp.useKsp2 to false via the DSL or the Gradle property please
# Verified on CI 2026-11-08: with the flag, ':manager:assembleShizukuplusRelease' never
# configures; without it, configuration succeeds and the build proceeds. KSP2 + Room 2.6.1 works
# here (the release build compiles and packages).
#
# Keep Room and KSP in step: if either is bumped, re-check this comment and AI_DEVLOG's
# Architecture Rules table before adding the flag back.
