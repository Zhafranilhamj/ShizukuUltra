org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.configureondemand=true
android.useAndroidX=true
android.nonTransitiveRClass=false

# KSP1, not KSP2. KSP2 (the default since KSP 2.0.x) requires Room 2.7+; Room is pinned to 2.6.1
# (stable), whose generated DAO code makes KSP2 fail with "unexpected jvm signature V".
# Removing this line breaks the build — see AI_DEVLOG.md, "Architecture Rules".
ksp.useKSP2=false

# SENTRY_DSN is injected by CI from the SENTRY_DSN secret. Keep it out of the repo: a committed
# DSN let forks report into this project and use up its quota. Builds without it skip Sentry.
android.newDsl=false

# NOTE (2026-11-08): KSP 2.3.6 no longer ships KSP1 at all - it fails configuration outright with
# "KSP1 is no longer available. Please use KSP2 instead". KSP2 is therefore what this project
# builds with, and the flag above is pinned to false only because AI_DEVLOG/AI_AGENT rules require
# it; it is inert on this KSP version. The Room 2.6.1 vs KSP2 concern is gone as well: Room's
# 2.7 line added KSP2 support, so keep Room and KSP in step if either is bumped.
