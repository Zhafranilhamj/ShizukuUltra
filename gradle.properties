org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.configureondemand=true
android.useAndroidX=true
android.nonTransitiveRClass=false

# KSP1, not KSP2. KSP2 (the default since KSP 2.0.x) requires Room 2.7+; Room is pinned to 2.6.1
# (stable), whose generated DAO code makes KSP2 fail with "unexpected jvm signature V".
# Removing this line breaks the build — see AI_DEVLOG.md, "Architecture Rules".
ksp.useKSP2=false

# SENTRY_DSN is injected by CI from the SENTRY_DSN secret. Keep it out of the repo: a committed
# DSN let forks report into this project and use up its quota. Builds without it skip Sentry.
android.newDsl=false
